  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ht: 600;\n  font-display: swap;\n  src: url(\"9899bc93-ab2d-47aa-a6cf-298035ed89e4\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1p t-weight: 700; letter-spacing: -0.02em; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"overflow-x:hidden\">\n\n  <header style=\"position:sticky;top:0;z-index:50;background:color-mix(in srgb, var(--ge-paper) 92%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ge-line)\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:30px\">\n      <a href=\"#top\" style=\"display:flex;align-items:center;gap:10px\">\n        <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 32 32\" fill=\"none\" stroke=\"var(--ge-blue)\" stroke-width=\"2\" aria-hidden=\"true\">\n          <rect x=\"2.5\" y=\"9.5\" width=\"27\" height=\"15\" rx=\"2.5\"><\u002Frect>\n          <path d=\"M9 9.5v15M16 9.5v15M23 9.5v15\" stroke-opacity=\"0.4\"><\u002Fpath>\n          <path d=\"M16 2.5v5\" stroke=\"var(--ge-yellow)\" stroke-linecap=\"round\"><\u002Fpath>\n          <path d=\"m13.4 5 2.6 2.6L18.6 5\" stroke=\"var(--ge-yellow)\" stroke-linecap=\"round\"><\u002Fpath>\n        <\u002Fsvg>\n        <span style=\"font-weight:700;font-size:21px;letter-spacing:-0.02em;color:var(--ge-navy);white-space:nowrap;flex:none\">Global<span style=\"color:var(--ge-blue)\">Export<\u002Fspan> <span style=\"color:var(--ge-yellow)\">5.0<\u002Fspan><\u002Fspan>\n      <\u002Fa>\n      <nav style=\"display:flex;flex-wrap:wrap;gap:12px 26px;margin-left:auto;min-width:0;font-size:15px;font-weight:500\">\n        <a href=\"#giai-phap\" style=\"color:var(--ge-navy)\">Giải pháp<\u002Fa>\n        <a href=\"#combo\" style=\"color:var(--ge-navy)\">Combo<\u002Fa>\n        <a href=\"#demo\" style=\"color:var(--ge-navy)\">Xem trước<\u002Fa>\n        <a href=\"#quy-trinh\" style=\"color:var(--ge-navy)\">Quy trình<\u002Fa>\n        <a href=\"#faq\" style=\"color:var(--ge-navy)\">Hỏi đáp<\u002Fa>\n      <\u002Fnav>\n      <a href=\"#dat-mua\" style=\"background:var(--ge-yellow);color:#1a1200;font-weight:700;font-size:15px;padding:12px 22px;border-radius:10px id;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 24px;font-size:15px\">\n          <li style=\"display:flex;gap:10px\"><span style=\"color:var(--ge-blue);font-weight:700;flex:none\">01<\u002Fspan>Khóa tìm khách cho toàn đội sales<\u002Fli>\n          <li style=\"display:flex;gap:10px\"><span style=\"color:var(--ge-blue);font-weight:700;flex:none\">02<\u002Fspan>Bộ công cụ AI cho 5 nhân viên<\u002Fli>\n          <li style=\"display:flex;gap:10px\"><span style=\"color:var(--ge-blue);font-weight:700;flex:none\">03<\u002Fspan>Chatbot 24/7 gắn đủ kênh<\u002Fli>\n          <li style=\"display:flex;gap:10px\"><span style=\"color:var(--ge-blue);font-weight:700;flex:none\">04<\u002Fspan>Hệ quản trị nhân sự &amp; phòng ban<\u002Fli>\n          <li style=\"display:flex;gap:10px\"><span style=\"color:var(--ge-blue);font-weight:700;flex:none\">05<\u002Fspan>Hệ dữ liệu phân loại khách hàng<\u002Fli>\n          <li style=\"display:flex;gap:10px\"><span style=\"color:var(--ge-yellow);font-weight:700;flex:none\">+<\u002Fspan>90 ngày đồng hành sau bàn giao<\u002Fli>\n        <\u002Ful>\n        <div style=\"display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap;padding-top:24px;border-top:1px solid var(--ge-line)\">\n          <div>\n            <div style=\"font-size:13px;color:var(--ge-muted);margin-bottom:6px\">Mua lẻ từng hạng mục<\u002Fdiv>\n            <div style=\"font-size:19px;text-decoration:line-through;color:var(--ge-muted)\">Từ 500.000đ<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:13px;color:var(--ge-red);font-weight:700;margin-bottom:6px\">Giá combo trọn bộ<\u002Fdiv>\n            <div style=\"font-size:44px;font-weight:700;line-height:1;color:var(--ge-navy)\">Liên Hệ Tư Vấn<\u002Fdiv>\n          <\u002Fdiv>\n          <a href=\"#dat-mua\" style=\"margin-left:auto;background:var(--ge-blue);color:#fff;font-weight:700;font-size:16px;padding:16px 28px;border-radius:12px\" style-hover=\"background:#1740b5\">Đặt combo td>\n            <sc-raw-td style=\"padding:16px 18px;border-top:1px solid var(--ge-line);color:var(--ge-muted)\">Tùy hợp đồng bàn giao<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:16px 18px;border-top:1px solid var(--ge-line);font-weight:600\">Dữ liệu và quy trình ở lại công ty<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding:16px 18px;border-top:1px solid var(--ge-line);font-weight:600\">Chi phí 12 tháng<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:16px 18px;border-top:1px solid var(--ge-line);color:var(--ge-muted)\">Thấp về tiền, đắt về thời gian bỏ lỡ<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:16px 18px;border-top:1px solid var(--ge-line);color:var(--ge-muted)\">Cộng dồn nhiều nhà cung cấp<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:16px 18px;border-top:1px solid var(--ge-line);font-weight:600\">Một hợp đồng, một đầu mối<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <section id=\"quy-trinh\" style=\"max-width:1200px;margin:0 auto;padding:70px 28px 0\">\n    <div style=\"text-align:center;margin-bottom:34px\">\n      <span style=\"display:inline-block;color:var(--ge-blue);font-weight:700;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:12px\">Quy trình<\u002Fspan>\n      <h2 style=\"font-size:40px;margin:0\">Ba bước từ đăng ký đến bàn giao<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px\">\n      <div style=\"background:var(--ge-paper);border:1px solid var(--ge-line);border-radius:18px;padding:30px 26px\">\n        <div style=\"width:44px;height:44px;border-radius:12px;background:var(--ge-blue);color:#fff;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:16px\">1<\u002Fdiv>\n        <h3 style=\"font-size:23px;margin:0 0 10px\">Đăng ký &amp; khảo sát<\u002Fh3>\n        <p style=\"font-size:15px;margin:0;color:var(--ge-muted)\">Điền form cuối trang. Trong 4 giờ làm việc, chúng tôi gọi lại 30 phút để làm rõ quy mô, thị trường và điểm nghẽn, rồi chốt hạng mục cần triển khai.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:var(--ge-paper);border:1px solid var(--ge-line);border-radius:18px;padding:30px 26px\">\n        <div style=\"width:44px;height:44px;border-radius:12px;background:var(--ge-yellow);color:#1a1200;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:16px\">2<\u002Fdiv>\n        <h3 style=\"font-size:23px;margin:0 0 10px\">Xác nhận &amp; thanh toán<\u002Fh3>\n        <p style=\"font-size:15px;margin:0;color:var(--ge-muted)\">Bạn nhận báo giá, phạm vi công việc và mốc bàn giao bằng văn bản. Thanh toán qua chuyển khoản, xuất hóa đơn cho khách doanh nghiệp.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:var(--ge-paper);border:1px solid var(--ge-line);border-radius:18px;padding:30px 26px\">\n        <div style=\"width:44px;height:44px;border-radius:12px;background:var(--ge-red);color:#fff;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:16px\">3<\u002Fdiv>\n        <h3 style=\"font-size:23px;margin:0 0 10px\">Triển khai &amp; bàn giao<\u002Fh3>\n        <p style=\"font-size:15px;margin:0;color:var(--ge-muted)\">Bộ công cụ và tài khoản giao trong 24 giờ. Hạng mục hệ thống chạy theo lộ trình 14 ngày, kết thúc bằng buổi huấn luyện cho toàn phòng.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ showTestimonials }}\" hint-placeholder-val=\"{{ true }}\">\n  <section style=\"max-width:1200px;margin:0 auto;padding:70px 28px 0\">\n    <div style=\"text-align:center;margin-bottom:34px\">\n      <span style=\"display:inline-block;color:var(--ge-blue);font-weight:700;font-size:13px;letter-spacing:0.12em;text-tr ght:600;margin:0\">Nghiệp vụ là gốc. AI là đòn bẩy.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--ge-muted);margin-bottom:14px\">Giải pháp<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;font-size:15px\">\n          <a href=\"#giai-phap\">Khóa tìm khách xuất khẩu<\u002Fa>\n          <a href=\"#giai-phap\">Bộ công cụ AI cho 5 nhân viên<\u002Fa>\n          <a href=\"#giai-phap\">Chatbot AI 24/7<\u002Fa>\n          <a href=\"#giai-phap\">Hệ quản trị nhân sự<\u002Fa>\n          <a href=\"#giai-phap\">Hệ dữ liệu khách hàng<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--ge-muted);margin-bottom:14px\">Tài nguyên<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;font-size:15px\">\n          <a href=\"#demo\">Xem trước prompt<\u002Fa>\n          <a href=\"#quy-trinh\">Quy trình triển khai<\u002Fa>\n          <a href=\"#faq\">Câu hỏi thường gặp<\u002Fa>\n          <a href=\"#combo\">Combo trọn hệ<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--ge-muted);margin-bottom:14px\">Liên hệ<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;font-size:15px\">\n          <a href=\"tel:0869395647\">0869395647<\u002Fa>\n          <a href=\"mailto:hello@globalexport5.com\">hello.globalexport5@gmail.com<\u002Fa>\n          <a href=\"#dat-mua\">Đăng ký tư vấn<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid var(--ge-line)\">\n      <div style=\"max-width:1200px;margin:0 auto;padding:18px 28px;display:flex;justify-content:space-between;gap:20px;font-size:13.5px;color:var(--ge-muted)\">\n        <span>© 2026 Global Export 5.0 — Toàn bộ nội dung thuộc quyền của bạn.<\u002Fspan>\n        <span>Giá và thông tin liên hệ là bản mẫu, cần cập nhật trước khi phát hành.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showComparison&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Khối nội dung&quot;},&quot;showTestimonials&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Khối nội dung&quot;}}\">\nconst DEMOS = [\n  {\n    code: \"P-014\",\n    title: \"Tìm buyer theo mã HS và thị trường\",\n    role: \"Sales xuất khẩu\",\n    body: `VAI TRÒ\nBạn là chuyên gia phát triển thị trường xuất khẩu 15 năm kinh nghiệm ngành [NGÀNH HÀNG], thông thạo dữ liệu thương mại và cách đọc hồ sơ nhà nhập khẩu.\n\nBỐI CẢNH\n- Sản phẩm: [TÊN SẢN PHẨM], mã HS [MÃ HS]\n- Năng lực cung: [SẢN LƯỢNG/THÁNG], MOQ [MOQ]\n- Chứng nhận đang có: [FDA / HACCP / FSC / BSCI / ...]\n- Thị trường muốn nhắm: [QUỐC GIA / KHU VỰC]\n- Điều kiện giao hàng quen dùng: [FOB / CIF / ...]\n\nYÊU CẦU\n1. Liệt kê 8 nhóm người mua tiềm năng, xếp theo độ phù hợp với năng lực trên.\n   Mỗi nhóm nêu: loại hình, quy mô đơn hàng điển hình, kỳ vọng chứng nhận.\n2. Với mỗi nhóm, chỉ ra 3 kênh tiếp cận cụ thể và dấu hiệu nhận biết họ đang\n   thực sự nhập hàng (hội chợ nào, hiệp hội nào, tín hiệu nào trên website).\n3. Nêu 5 câu hỏi thẩm định cần hỏi trước khi bỏ công báo giá.\n4. Cảnh báo 3 rủi ro thường gặp khi bán vào thị trường này.\n\nĐỊNH DẠNG\nBảng cho mục 1 và 2. Gạch đầu dòng cho mục 3 và 4. Không viết mở đầu.\n\nRÀNG BUỘC\nChỉ dùng thông tin tôi cung cấp và kiến thức ngành. Chỗ nào cần số liệu tôi\nchưa có, ghi rõ \"cần kiểm chứng\" thay vì tự suy đoán con số.`\n  },\n  {\n    code: \"P-051\",\n    title: \"Đối chiếu bộ chứng từ trước khi gửi\",\n    role: \"Nhân viên chứng từ\",\n    body: `VAI TRÒ\nBạn là kiểm soát viên chứng từ xuất khẩu, quen bị ngân hàng bắt lỗi và biết\nchính xác chỗ nào thường sai.\n\nDỮ LIỆU\n- Hợp đồng / PO: [DÁN NỘI DUNG]\n- Invoice: [DÁN NỘI DUNG]\n- Packing List: [DÁN NỘI DUNG]\n- Bill of Lading: [DÁN NỘI DUNG]\n- L/C (nếu có): [DÁN NỘI DUNG]\n- C/O, Phyto, các giấy khác: [DÁN NỘI DUNG]\n\nVIỆC CẦN LÀM\n1. Lập bảng đối chiếu các trường sau giữa TẤT CẢ chứng từ: tên và địa chỉ\n   shipper/consignee, mô tả hàng, số lượng, đơn giá, tổng tiền, trọng lượng,\n   số container/seal, cảng đi/cảng đến, ngày phát hành, điều kiện Incoterms.\n2. Cột cuối ghi TRÙNG KHỚP hoặc LỆCH. Với mỗi ô lệch, nêu lệch ở đâu và sửa\n   trên chứng từ nào là đúng thông lệ.\n3. Nếu có L/C: soát riêng thời hạn xuất trình, mô tả hàng và bộ chứng từ yêu\n   cầu; liệt kê mọi điểm có nguy cơ bị từ chối thanh toán.\n4. Kết luận: bộ này gửi được chưa, hay phải sửa gì trước.\n\nRÀNG BUỘC\nKhông tự điền thông tin thiếu. Trường nào tôi không cung cấp thì ghi\n\"THIẾU DỮ LIỆU\" và nói rõ hậu quả nếu để trống.`\n  },\n  {\n    code: \"P-039\",\n    title: \"Trả lời buyer đòi giảm giá\",\n    role: \"Sales / quản lý\",\n    body: `VAI TRÒ\nBạn là người đàm phán bán hàng quốc tế, giữ được giá mà không mất khách.\n\nBỐI CẢNH\n- Email của buyer: [DÁN EMAIL]\n- Báo giá tôi đã gửi: [GIÁ + INCOTERMS + MOQ]\n- Mức sàn tôi có thể xuống: [GIÁ SÀN] (KHÔNG được tiết lộ con số này)\n- Lợi thế thật của tôi: [VD: giao 20 ngày, có FSC, tự chủ nguyên liệu]\n- Quan hệ hiện tại: [khách mới / đã mua 2 lần / khách lớn]\n\nVIỆC CẦN LÀM\n1. Đọc email và chỉ ra: buyer đang thật sự cần gì, đâu là áp lực giá thật và\n   đâu là phép thử thăm dò.\n2. Đề xuất 3 hướng phản hồi, mỗi hướng nêu rõ được gì mất gì:\n   (a) giữ giá và tăng giá trị, (b) giảm giá có điều kiện đổi lại,\n   (c) chào cấu hình rẻ hơn.\n3. Viết email trả lời cho hướng bạn khuyên dùng: tiếng Anh thương mại, dưới\n   180 từ, giọng tôn trọng nhưng chắc, kết bằng một câu hỏi mở.\n4. Dự đoán câu trả lời tiếp theo của buyer và gợi ý cách đáp.\n\nRÀNG BUỘC\nKhông hạ giá xuống dưới mức sàn. Không hứa điều tôi chưa xác nhận làm được.`\n  }\n];\n\nconst FAQS = [\n  { q: \"Tôi cần tài khoản AI trả phí mới dùng được không?\",\n    a: \"Bộ prompt và template chạy tốt trên tài khoản AI miễn phí. Nhóm trợ lý dựng sẵn và chatbot cần tài khoản trả phí — tài liệu bàn giao có hướng dẫn phương án thay thế nếu doanh nghiệp bạn dùng công cụ khác.\" },\n  { q: \"Doanh nghiệp tôi hơn 5 nhân sự thì tính thế nào?\",\n    a: \"Gói công cụ AI báo giá theo 5 tài khoản. Từ nhân sự thứ 6 trở đi tính theo đầu người với mức giảm dần theo quy mô. Ghi số lượng vào form đăng ký để nhận báo giá đúng.\" },\n  { q: \"Chatbot 1.000 USD gồm những gì, có phí duy trì không?\",\n    a: \"Mức này gồm khảo sát nội dung, huấn luyện trên tài liệu của bạn, gắn vào các kênh đã thống nhất, và 30 ngày tinh chỉnh sau khi chạy thật. Phí duy trì hàng tháng chỉ gồm chi phí nền tảng AI theo lượng hội thoại thực tế — chúng tôi báo minh bạch trước khi ký.\" },\n  { q: \"Hệ thống nhân sự và hệ dữ liệu khách hàng vì sao chưa có giá?\",\n    a: \"Vì hai hạng mục này phụ thuộc vào số phòng ban, số nhân sự và tình trạng dữ liệu hiện có. Chúng tôi khảo sát 30 phút rồi báo giá theo phạm vi thật, thay vì bán một con số không khớp với công ty bạn.\" },\n  { q: \"Dữ liệu khách hàng của tôi có bị đưa lên AI công cộng không?\",\n    a: \"Không, nếu triển khai theo quy trình chúng tôi bàn giao. Một phần công việc là thiết lập nguyên tắc dữ liệu nào được đưa vào công cụ AI, dữ liệu nào phải ẩn danh trước, và ai được cấp quyền gì.\" },\n  { q: \"Có được hoàn tiền không?\",\n    a: \"Có. Trong 7 ngày đầu, nếu sản phẩm không đúng như mô tả đã cam kết bằng văn bản, bạn được hoàn 100%. Với hạng mục triển khai hệ thống, cam kết hoàn theo mốc bàn giao ghi trong hợp đồng.\" }\n];\n\nconst OPTIONS = [\n  \"Khóa học Các cách tìm khách — 499.000đ\",\n  \"Bộ công cụ AI cho 5 nhân viên — 3.000.000đ\",\n  \"Chatbot AI 24/7 — 1.000 USD\",\n  \"Hệ thống quản trị nhân sự & phòng ban — cần báo giá\",\n  \"Hệ thống dữ liệu & phân loại khách hàng — cần báo giá\",\n  \"COMBO trọn hệ Global Export 5.0 — Đặt lịch tư vấn\"\n];\n\nconst GREETING = \"Chào anh/chị 👋 Mình là trợ lý của Global Export 5.0 đây. Anh/chị đang cần tìm khách, dọn chứng từ, hay đang tìm một trợ lý AI trực 24/7 cho phòng XNK của mình? Cứ hỏi mình bất cứ gì — giá cả, thời gian triển khai, hay hạng mục nào hợp với quy mô công ty mình — mình trả lời ngay, không cần chờ 4 tiếng đâu 😄\";\n\nconst CHIPS = [\"Giá bao nhiêu?\", \"Bao lâu thì dùng được?\", \"Chatbot có đúng giá công ty mình không?\", \"Để tôi nghĩ thêm\"];\n\nconst RULES = [\n  { keys: [\"giá\", \"bao nhiêu tiền\", \"phí\", \"chi phí\"],\n    text: \"Mỗi hạng mục có giá và nội dung riêng, chạy độc lập được, không bắt buộc mua trọn gói đâu ạ. Khóa học tìm khách xuất khẩu là 499.000đ, học một lần dùng mãi. Bộ công cụ AI cho 5 nhân viên đang giảm còn 3.000.000đ (từ 5.000.000đ), cấp 5 tài khoản, triển khai 7 ngày. Chatbot AI trực 24/7 là 1.000 USD, huấn luyện đúng theo catalogue và giá của công ty mình. Hai hạng mục hệ thống — nhân sự và dữ liệu khách hàng — thì báo giá theo quy mô, cần khảo sát nhanh trước. Anh/chị đang quan tâm hạng mục nào để mình nói kỹ hơn?\" },\n  { keys: [\"đóng tiền\", \"thanh toán\", \"trả trước\", \"cọc\"],\n    text: \"Không ạ. Đăng ký chỉ để lại thông tin thôi, tụi mình gọi lại trong 4 giờ làm việc để hiểu đúng nhu cầu rồi mới báo giá và mốc bàn giao cụ thể. Chưa cần thanh toán gì ở bước này hết.\" },\n  { keys: [\"bao lâu\", \"khi nào có\", \"triển khai mất\", \"thời gian\"],\n    text: \"Trong 4 giờ làm việc sẽ có người gọi lại tầm 30 phút để hiểu quy mô, thị trường, điểm nghẽn của mình. Sau khi chốt, bộ công cụ hoặc tài khoản bàn giao trong 24 giờ; còn hạng mục hệ thống (nhân sự, dữ liệu, combo trọn hệ) thì chạy theo lộ trình 14 ngày, kết thúc bằng buổi huấn luyện cho cả phòng.\" },\n  { keys: [\"hoàn tiền\", \"không đúng mô tả\", \"bảo hành\", \"không hài lòng\"],\n    text: \"Hoàn 100% trong 7 ngày nếu sản phẩm không đúng như mô tả, anh/chị yên tâm.\" },\n  { keys: [\"hóa đơn\", \"hợp đồng\", \"xuất hóa đơn\"],\n    text: \"Có ạ, xuất hóa đơn và hợp đồng đầy đủ cho khách doanh nghiệp.\" },\n  { keys: [\"đúng giá công ty\", \"đúng hàng\", \"chung chung\", \"catalogue\"],\n    text: \"Chatbot được huấn luyện riêng trên catalogue, MOQ và chính sách giá thật của từng công ty, không phải bot trả lời đại khái đâu. Trước khi triển khai có buổi khảo sát 30 phút để hiểu đúng ngành hàng, thị trường của mình trước.\" },\n  { keys: [\"tiếng anh\", \"nước ngoài\", \"đa ngôn ngữ\", \"khách quốc tế\"],\n    text: \"Có, đa ngôn ngữ Anh, Trung, Nhật, Hàn, Tây Ban Nha, gắn được vào website, Messenger, WhatsApp, Zalo OA luôn. Khách hỏi hàng lúc mình đang ngủ vẫn có người trả lời liền — chậm trả lời là mất đơn, không phải mất điểm thôi.\" },\n  { keys: [\"chưa có khách\", \"tìm buyer\", \"nguồn khách\", \"chưa ổn định\"],\n    text: \"Vậy hợp với Khóa học tìm khách xuất khẩu nhất — có bản đồ 9 kênh tìm buyer (hội chợ, B2B, LinkedIn, dữ liệu hải quan) và quy trình thẩm định buyer trước khi báo giá, 499.000đ học một lần dùng mãi.\" },\n  { keys: [\"không chốt được\", \"follow-up\", \"khách không mua\", \"hỏi hàng nhưng\"],\n    text: \"Thường là vướng ở khâu follow-up và đàm phán. Bộ công cụ AI cho nhân viên Sales có phần cold email, đàm phán, follow-up theo phễu 7 chạm, giúp không bỏ sót khách đang ấm.\" },\n  { keys: [\"công ty nhỏ\", \"quy mô nhỏ\", \"có cần không\", \"chưa chắc cần\", \"phù hợp\", \"hợp với nhu cầu\", \"có hợp không\", \"đúng nhu cầu\"],\n    text: \"5 hạng mục chạy độc lập được, không phải mua trọn combo mới dùng được, nên công ty nhỏ vẫn chọn đúng 1 hạng mục cần nhất là được. Cái này tùy điểm nghẽn công ty mình đang gặp: chưa có nguồn khách → Khóa học tìm khách; hỏi hàng nhiều mà không chốt được → Bộ công cụ AI cho Sales; chứng từ hay sai/bị trả về → Bộ công cụ AI cho Chứng từ; dữ liệu khách rải rác, sợ mất khi nhân sự nghỉ → Hệ thống dữ liệu khách hàng; cần trực khách ngoài giờ hành chính → Chatbot 24/7. Anh/chị đang vướng chỗ nào nhất để mình chỉ đúng hạng mục?\" },\n  { keys: [\"nghĩ thêm\", \"suy nghĩ\", \"để tôi nghĩ\", \"chưa vội\", \"cân nhắc\"], cta: true,\n    text: \"Dạ được ạ, đây là quyết định cho cả phòng nên cân nhắc kỹ là đúng rồi. Trong lúc đó anh/chị cứ điền form đăng ký tư vấn giúp mình — không ràng buộc gì, chỉ để giữ liên lạc thôi. Để lại đúng điểm nghẽn mình đang gặp, tụi mình gọi lại tư vấn sát nhu cầu hơn, lúc đó anh/chị chốt cũng không muộn.\" },\n  { keys: [\"mua\", \"đăng ký\", \"bắt đầu sao\", \"quan tâm\", \"chốt\", \"làm sao để bắt đầu\"], cta: true,\n    text: \"Nghe vậy là đúng hạng mục mình cần rồi đó. Anh/chị điền form đăng ký tư vấn giúp mình nhé — không cần thanh toán gì ở bước này, chỉ để tụi mình có thông tin gọi lại trong 4 giờ làm việc, khảo sát nhanh rồi báo giá và mốc bàn giao cụ thể luôn. Nghiệp vụ là gốc, AI là đòn bẩy — mình lo phần dựng đúng cho công ty mình, anh/chị chỉ cần để lại thông tin thôi 👇\" }\n];\n\nconst FALLBACK = { cta: true, text: \"Câu này mình muốn trả lời cho chính xác, để tụi mình gọi lại tư vấn kỹ hơn nhé. Anh/chị điền form đăng ký bên dưới, để lại đúng điểm nghẽn hoặc câu hỏi của mình, có người gọi lại trong 4 giờ làm việc. Trong lúc chờ, anh/chị có thể bấm các gợi ý bên dưới để mình trả lời nhanh mấy câu hay gặp nhất.\" };\n\nfunction botReply(q) {\n  const t = (q || \"\").toLowerCase();\n  for (const r of RULES) { if (r.keys.some(k => t.includes(k))) return r; }\n  return FALLBACK;\n}\n\nclass Component extends DCLogic {\n  state = { active: 0, open: 0, submitted: false, copied: false, product: OPTIONS[5],\n            botOpen: false, botSeen: false, botDraft: \"\", log: [] };\n\n  openChat() {\n    this.setState(s => ({\n      botOpen: true, botSeen: true,\n      log: s.log.length ? s.log : [{ from: \"bot\", text: GREETING }]\n    }));\n  }\n\n  pushAsk(q) {\n    const text = (q || \"\").trim();\n    if (!text) return;\n    const r = botReply(text);\n    this.setState(s => ({\n      botDraft: \"\",\n      log: s.log.concat([{ from: \"me\", text }, { from: \"bot\", text: r.text, cta: !!r.cta }])\n    }));\n  }\n\n  renderVals() {\n    const active = DEMOS[this.state.active];\n    return {\n      demos: DEMOS.map((d, i) => ({\n        code: d.code, title: d.title, role: d.role,\n        select: () => this.setState({ active: i, copied: false }),\n        tabStyle: `display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;padding:20px 22px;border-radius:16px;background:${i === this.state.active ? \"#eaf0ff\" : \"#ffffff\"};border:1.5px solid ${i === this.state.active ? \"var(--ge-blue)\" : \"var(--ge-line)\"};font-family:var(--font-body);color:var(--ge-navy)`\n      })),\n      activeCode: active.code,\n      activeTitle: active.title,\n      activeBody: active.body,\n      copyLabel: this.state.copied ? \"Đã copy\" : \"Copy prompt\",\n      copyPrompt: () => {\n        try { navigator.clipboard.writeText(active.body); } catch (e) { /* clipboard blocked */ }\n        this.setState({ copied: true });\n        setTimeout(() => this.setState({ copied: false }), 1800);\n      },\n      faqs: FAQS.map((f, i) => {\n        const open = this.state.open === i;\n        const last = i === FAQS.length - 1;\n        return {\n          q: f.q, a: f.a,\n          toggle: () => this.setState({ open: open ? -1 : i }),\n          rowStyle: last ? \"\" : \"border-bottom:1px solid var(--ge-line)\",\n          signStyle: `flex:none;font-size:26px;line-height:1;color:var(--ge-blue);transform:rotate(${open ? 45 : 0}deg);transition:transform .18s ease`,\n          bodyStyle: `overflow:hidden;max-height:${open ? 320 : 0}px;transition:max-height .24s ease`\n        };\n      }),\n      options: OPTIONS.map(label => ({\n        label, value: label,\n        checked: this.state.product === label,\n        pick: () => this.setState({ product: label })\n      })),\n      botOpen: this.state.botOpen,\n      botBadge: !this.state.botSeen,\n      botDraft: this.state.botDraft,\n      botChips: CHIPS.map(label => ({ label, ask: () => this.pushAsk(label) })),\n      botLog: this.state.log.map(m => ({\n        text: m.text,\n        cta: !!m.cta,\n        rowStyle: `display:flex;flex-direction:column;gap:10px;align-items:${m.from === \"me\" ? \"flex-end\" : \"flex-start\"}`,\n        bubbleStyle: m.from === \"me\"\n          ? \"max-width:84%;background:var(--ge-blue);color:#fff;font-size:14.5px;line-height:1.55;padding:12px 15px;border-radius:14px 14px 4px 14px\"\n          : \"max-width:92%;background:var(--ge-paper);color:var(--ge-navy);font-size:14.5px;line-height:1.6;padding:13px 15px;border:1px solid var(--ge-line);border-radius:14px 14px 14px 4px\"\n      })),\n      toggleBot: () => { if (this.state.botOpen) this.setState({ botOpen: false }); else this.openChat(); },\n      closeBot: () => this.setState({ botOpen: false }),\n      botType: e => this.setState({ botDraft: e.target.value }),\n      botSend: e => { e.preventDefault(); this.pushAsk(this.state.botDraft); },\n      showComparison: this.props.showComparison ?? true,\n      showTestimonials: this.props.showTestimonials ?? true,\n      submitted: this.state.submitted,\n      formOpen: !this.state.submitted,\n      onSubmit: e => {\n        const form = e.currentTarget;\n        setTimeout(() => { try { form.reset(); } catch (err) {} this.setState({ submitted: true }); }, 180);\n      },\n      resetForm: () => this.setState({ submitted: false })\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
